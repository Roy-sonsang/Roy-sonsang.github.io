<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간단한 메모장</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
            line-height: 1.6;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        form {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        fieldset {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
        }
        
        legend {
            font-weight: bold;
            color: #555;
            padding: 0 10px;
            font-size: 1.2em;
        }
        
        label {
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 5px;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #4CAF50;
        }
        
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }
        
        textarea:focus {
            outline: none;
            border-color: #4CAF50;
        }
        
        input[type="submit"], input[type="reset"] {
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
            transition: background-color 0.3s ease;
        }
        
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        
        input[type="reset"] {
            background-color: #f44336;
        }
        
        input[type="reset"]:hover {
            background-color: #da190b;
        }
        
        hr {
            border: none;
            height: 2px;
            background-color: #e0e0e0;
            margin: 30px 0;
        }
        
        ::placeholder {
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>간단한 메모장</h1>
    
    <!-- 메모 입력 폼 -->
    <form id="memoForm">
        <fieldset>
            <legend>새 메모 작성</legend>
            <label for="memo-title">제목:</label><br>
            <input type="text" id="memo-title" name="title" placeholder="메모 제목을 입력하세요" required><br><br>
            
            <label for="memo-content">내용:</label><br>
            <textarea id="memo-content" name="content" rows="10" cols="50" placeholder="메모 내용을 입력하세요" required></textarea><br><br>
            
            <input type="submit" value="메모 저장">
            <input type="button" id="resetBtn" value="초기화">
        </fieldset>
    </form>
    
    <hr>
    
    <!-- 메모 목록 표시 영역 -->
    <div id="memoList">
        <h2>저장된 메모</h2>
        <div id="memos"></div>
    </div>

    <script>
        // 메모 데이터를 저장할 배열
        let memos = [];
        
        // 페이지 로드 시 저장된 메모 불러오기
        window.addEventListener('DOMContentLoaded', function() {
            loadMemos();
            displayMemos();
        });
        
        // 폼 제출 이벤트 처리
        document.getElementById('memoForm').addEventListener('submit', function(e) {
            e.preventDefault(); // 기본 폼 제출 방지
            
            const title = document.getElementById('memo-title').value.trim();
            const content = document.getElementById('memo-content').value.trim();
            
            if (title && content) {
                // 새 메모 객체 생성
                const newMemo = {
                    id: Date.now(), // 고유 ID 생성
                    title: title,
                    content: content,
                    date: new Date().toLocaleDateString('ko-KR')
                };
                
                // 메모 배열에 추가
                memos.push(newMemo);
                
                // 로컬 스토리지에 저장
                saveMemos();
                
                // 화면에 표시
                displayMemos();
                
                // 폼 초기화
                this.reset();
                
                // 성공 메시지
                alert('메모가 저장되었습니다!');
            } else {
                alert('제목과 내용을 모두 입력해주세요.');
            }
        });
        
        // 초기화 버튼 이벤트 처리
        document.getElementById('resetBtn').addEventListener('click', function() {
            if (confirm('입력한 내용을 모두 지우시겠습니까?')) {
                document.getElementById('memoForm').reset();
            }
        });
        
        // 메모 삭제 함수
        function deleteMemo(id) {
            if (confirm('이 메모를 삭제하시겠습니까?')) {
                memos = memos.filter(memo => memo.id !== id);
                saveMemos();
                displayMemos();
            }
        }
        
        // 메모 표시 함수
        function displayMemos() {
            const memosContainer = document.getElementById('memos');
            
            if (memos.length === 0) {
                memosContainer.innerHTML = '<p style="text-align: center; color: #666; font-style: italic;">저장된 메모가 없습니다.</p>';
                return;
            }
            
            memosContainer.innerHTML = memos.map(memo => `
                <div style="background-color: #fff; padding: 20px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                    <h3 style="margin-top: 0; color: #333;">${memo.title}</h3>
                    <p style="white-space: pre-wrap; margin: 10px 0;">${memo.content}</p>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                        <small style="color: #666;">작성일: ${memo.date}</small>
                        <button onclick="deleteMemo(${memo.id})" style="background-color: #f44336; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 12px;">삭제</button>
                    </div>
                </div>
            `).join('');
        }
        
        // 로컬 스토리지에 메모 저장
        function saveMemos() {
            localStorage.setItem('memos', JSON.stringify(memos));
        }
        
        // 로컬 스토리지에서 메모 불러오기
        function loadMemos() {
            const savedMemos = localStorage.getItem('memos');
            if (savedMemos) {
                memos = JSON.parse(savedMemos);
            }
        }
    </script>
</body>
</html>
